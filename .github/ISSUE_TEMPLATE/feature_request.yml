name: ✨ Feature Request
description: Propose a new feature for the TwinStack platform
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Proposed Feature
      placeholder: What should TwinStack do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do we need this?
      placeholder: Explain the value to the Architect, Builder, or Guests.
    validations:
      required: true
